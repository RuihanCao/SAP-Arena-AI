<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAP-Arena-AI Replays</title>
  <link rel="stylesheet" href="/static/app.css" />
  <link rel="stylesheet" href="/static/duel.css" />
  <script src="/static/build_guard.js" defer></script>
</head>
<body class="duel-body replay-body">
  <header class="replay-topbar">
    <div>
      <h1 class="menu-title">Replays</h1>
      <p class="menu-sub">Completed games against the agent.</p>
    </div>
    <nav class="menu-actions">
      <a class="menu-btn" href="/play">Play</a>
      <a class="menu-btn secondary" href="/sandbox">Sandbox</a>
      <a class="menu-btn secondary" href="/">Menu</a>
    </nav>
  </header>
  <main class="replay-browser">
    <aside class="replay-list-panel">
      <input id="replay-search" class="replay-search" type="search" placeholder="seed, winner, commit…" />
      <div id="replay-list" class="replay-list" aria-live="polite"></div>
    </aside>
    <section class="replay-detail-panel">
      <div class="menu-empty" id="replays-empty">No completed games yet. Finish a game in Play to see its replay here.</div>
      <div id="replay-meta" class="replay-meta" hidden></div>
      <div id="replay-turns" class="replay-turns"></div>
    </section>
  </main>
  <footer class="replay-legacy-note">
    Games are saved locally by the demo server.
  </footer>
  <script src="/static/search_telemetry.js"></script>
  <script src="/static/replays.js"></script>
</body>
</html>
